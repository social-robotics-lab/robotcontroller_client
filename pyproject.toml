[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robotcontroller-client"
version = "0.1.0"
description = "Standard-library Python client for RobotController"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.9"]
gtts = ["gTTS>=2.5"]
azure = ["azure-cognitiveservices-speech>=1.40"]

[tool.setuptools.packages.find]
include = ["robotcontroller*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
